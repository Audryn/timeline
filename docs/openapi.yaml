            minimum: 0
            maximum: 1000000
            default: 0
        - name: event
          in: query
          schema:
            type: string
            format: uuid
        - name: person
          in: query
          style: form
          explode: true
          description: Repeated UUID query parameters; OR within a selection, AND between
            filter types.
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              format: uuid
        - name: category
          in: query
          style: form
          explode: true
          description: Repeated UUID query parameters; OR within a selection, AND between
            filter types.
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              format: uuid
        - name: q
          in: query
          description: Trimmed literal substring search.
          schema:
            type: string
            maxLength: 200
        - name: from
          in: query
          description: Inclusive date overlap; empty string means no bound. from must not
            exceed to.
          schema:
            anyOf:
              - type: string
                format: date
              - const: ""
        - name: to
          in: query
          description: Inclusive date overlap; empty string means no bound. from must not
            exceed to.
          schema:
            anyOf:
              - type: string
                format: date
              - const: ""
        - name: undated
          in: query
          description: Only the literal string false excludes Undated; all other values
            include it.
          schema:
            type: string
            default: "true"
