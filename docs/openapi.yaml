  /api/auth/callback:
    get:
      operationId: callback
      summary: Consume confirmation/recovery token or PKCE code
      security: []
      description: This GET consumes a token and is NOT a read-only production probe.
        Fixed same-origin redirect only. PKCE requires the originating verifier
        cookie.
      parameters:
        - name: token_hash
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum:
              - signup
              - recovery
        - name: code
          in: query
          schema:
            type: string
        - name: flow
          in: query
          schema:
            type: string
            enum:
              - recovery
      responses:
        "307":
          description: Projects on success; account password mode for recovery;
            notice=expired/failed otherwise.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              schema:
                type: string
                const: private, no-store
            Referrer-Policy:
              description: Current proxy overrides the callback's route-level no-referrer
                value.
              schema:
                type: string
                const: same-origin
        "500":
          description: APP_ORIGIN missing/invalid before a redirect can be constructed.
