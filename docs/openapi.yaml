openapi: 3.1.0
info:
  title: Timeline HTTP API
  version: 0.1.0
  description: Existing web cookie API; native authentication is not implemented.
    Zod schemas are canonical. Gregorian calendar validity, range ordering,
    unique participant/category IDs and request replay/version rules are
    enforced beyond structural JSON Schema.
servers:
  - url: /
    description: Same-origin application backend
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: sb-<project-ref>-auth-token
      description: Supabase SSR HttpOnly session cookie; actual project-specific name
        may be chunked (.0/.1). Secure in production, SameSite=Lax. No
        bearer-token alternative exists yet.
  schemas:
    CivilDate:
      type: object
      properties:
        year:
          type: integer
          minimum: 1
          maximum: 9999
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
      required:
        - year
      additionalProperties: false
    EventDate:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              const: point
            value:
              type: object
              properties:
                year:
                  type: integer
                  minimum: 1
                  maximum: 9999
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                day:
                  type: integer
                  minimum: 1
                  maximum: 31
              required:
                - year
              additionalProperties: false
            approximate:
              default: false
              type: boolean
          required:
            - kind
            - value
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: range
            start:
              type: object
              properties:
                year:
                  type: integer
                  minimum: 1
                  maximum: 9999
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                day:
                  type: integer
                  minimum: 1
                  maximum: 31
              required:
                - year
              additionalProperties: false
            end:
              anyOf:
                - type: object
                  properties:
                    year:
                      type: integer
                      minimum: 1
                      maximum: 9999
                    month:
                      type: integer
                      minimum: 1
                      maximum: 12
                    day:
                      type: integer
                      minimum: 1
                      maximum: 31
                  required:
                    - year
                  additionalProperties: false
                - type: "null"
            approximate:
              default: false
              type: boolean
          required:
            - kind
            - start
            - end
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: season
            season:
              type: string
              enum:
                - spring
                - summer
                - autumn
                - winter
            year:
              type: integer
              minimum: 1
              maximum: 9998
            approximate:
              default: false
              type: boolean
          required:
            - kind
            - season
            - year
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: custom
            text:
              type: string
              minLength: 1
              maxLength: 200
            start:
              anyOf:
                - type: object
                  properties:
                    year:
                      type: integer
                      minimum: 1
                      maximum: 9999
                    month:
                      type: integer
                      minimum: 1
                      maximum: 12
                    day:
                      type: integer
                      minimum: 1
                      maximum: 31
                  required:
                    - year
                  additionalProperties: false
                - type: "null"
            end:
              anyOf:
                - type: object
                  properties:
                    year:
                      type: integer
                      minimum: 1
                      maximum: 9999
                    month:
                      type: integer
                      minimum: 1
                      maximum: 12
                    day:
                      type: integer
                      minimum: 1
                      maximum: 31
                  required:
                    - year
                  additionalProperties: false
                - type: "null"
          required:
            - kind
            - text
            - start
            - end
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: unknown
          required:
            - kind
          additionalProperties: false
    Credentials:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - email
        - password
      additionalProperties: false
    EmailInput:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
      required:
        - email
      additionalProperties: false
    PasswordInput:
      type: object
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 128
      required:
        - password
      additionalProperties: false
    ProjectInput:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        name:
          type: string
          minLength: 1
          maxLength: 120
        personName:
          type: string
          minLength: 1
          maxLength: 100
        personKind:
          type: string
          enum:
            - real
            - fictional
        hemisphere:
          type: string
          enum:
            - northern
            - southern
      required:
        - requestId
        - name
        - personName
        - personKind
        - hemisphere
      additionalProperties: false
    PersonInput:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          type: string
          enum:
            - real
            - fictional
      required:
        - requestId
        - name
        - kind
      additionalProperties: false
    EventInput:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 20000
        location:
          type: string
          maxLength: 300
        date:
          oneOf:
            - type: object
              properties:
                kind:
                  type: string
                  const: point
                value:
                  type: object
                  properties:
                    year:
                      type: integer
                      minimum: 1
                      maximum: 9999
                    month:
                      type: integer
                      minimum: 1
                      maximum: 12
                    day:
                      type: integer
                      minimum: 1
                      maximum: 31
                  required:
                    - year
                  additionalProperties: false
                approximate:
                  default: false
                  type: boolean
              required:
                - kind
                - value
              additionalProperties: false
            - type: object
              properties:
                kind:
                  type: string
                  const: range
                start:
                  type: object
                  properties:
                    year:
                      type: integer
                      minimum: 1
                      maximum: 9999
                    month:
                      type: integer
                      minimum: 1
                      maximum: 12
                    day:
                      type: integer
                      minimum: 1
                      maximum: 31
                  required:
                    - year
                  additionalProperties: false
                end:
                  anyOf:
                    - type: object
                      properties:
                        year:
                          type: integer
                          minimum: 1
                          maximum: 9999
                        month:
                          type: integer
                          minimum: 1
                          maximum: 12
                        day:
                          type: integer
                          minimum: 1
                          maximum: 31
                      required:
                        - year
                      additionalProperties: false
                    - type: "null"
                approximate:
                  default: false
                  type: boolean
              required:
                - kind
                - start
                - end
              additionalProperties: false
            - type: object
              properties:
                kind:
                  type: string
                  const: season
                season:
                  type: string
                  enum:
                    - spring
                    - summer
                    - autumn
                    - winter
                year:
                  type: integer
                  minimum: 1
                  maximum: 9998
                approximate:
                  default: false
                  type: boolean
              required:
                - kind
                - season
                - year
              additionalProperties: false
            - type: object
              properties:
                kind:
                  type: string
                  const: custom
                text:
                  type: string
                  minLength: 1
                  maxLength: 200
                start:
                  anyOf:
                    - type: object
                      properties:
                        year:
                          type: integer
                          minimum: 1
                          maximum: 9999
                        month:
                          type: integer
                          minimum: 1
                          maximum: 12
                        day:
                          type: integer
                          minimum: 1
                          maximum: 31
                      required:
                        - year
                      additionalProperties: false
                    - type: "null"
                end:
                  anyOf:
                    - type: object
                      properties:
                        year:
                          type: integer
                          minimum: 1
                          maximum: 9999
                        month:
                          type: integer
                          minimum: 1
                          maximum: 12
                        day:
                          type: integer
                          minimum: 1
                          maximum: 31
                      required:
                        - year
                      additionalProperties: false
                    - type: "null"
              required:
                - kind
                - text
                - start
                - end
              additionalProperties: false
            - type: object
              properties:
                kind:
                  type: string
                  const: unknown
              required:
                - kind
              additionalProperties: false
        personIds:
          minItems: 1
          maxItems: 100
          type: array
          items:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        categoryIds:
          maxItems: 50
          type: array
          items:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - requestId
        - id
        - version
        - title
        - description
        - location
        - date
        - personIds
        - categoryIds
      additionalProperties: false
    ProjectCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - id
    Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        project_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        name:
          type: string
        kind:
          type: string
          enum:
            - real
            - fictional
      required:
        - id
        - project_id
        - name
        - kind
    EventSaved:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        version:
          type: number
      required:
        - id
        - version
    Session:
      type: object
      properties:
        configured:
          type: boolean
        user:
          anyOf:
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                email:
                  type: string
              required:
                - id
                - email
            - type: "null"
      required:
        - configured
        - user
    Projects:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          name:
            type: string
          hemisphere:
            type: string
            enum:
              - northern
              - southern
        required:
          - id
          - name
          - hemisphere
    ProjectDetail:
      type: object
      properties:
        project:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            name:
              type: string
            hemisphere:
              type: string
              enum:
                - northern
                - southern
          required:
            - id
            - name
            - hemisphere
        people:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              project_id:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              name:
                type: string
              kind:
                type: string
                enum:
                  - real
                  - fictional
            required:
              - id
              - project_id
              - name
              - kind
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              project_id:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              name:
                type: string
              color:
                type: string
            required:
              - id
              - project_id
              - name
              - color
      required:
        - project
        - people
        - categories
    EventPage:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              project_id:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              version:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              title:
                type: string
              description:
                type: string
              location:
                type: string
              date:
                oneOf:
                  - type: object
                    properties:
                      kind:
                        type: string
                        const: point
                      value:
                        type: object
                        properties:
                          year:
                            type: integer
                            minimum: 1
                            maximum: 9999
                          month:
                            type: integer
                            minimum: 1
                            maximum: 12
                          day:
                            type: integer
                            minimum: 1
                            maximum: 31
                        required:
                          - year
                        additionalProperties: false
                      approximate:
                        default: false
                        type: boolean
                    required:
                      - kind
                      - value
                    additionalProperties: false
                  - type: object
                    properties:
                      kind:
                        type: string
                        const: range
                      start:
                        type: object
                        properties:
                          year:
                            type: integer
                            minimum: 1
                            maximum: 9999
                          month:
                            type: integer
                            minimum: 1
                            maximum: 12
                          day:
                            type: integer
                            minimum: 1
                            maximum: 31
                        required:
                          - year
                        additionalProperties: false
                      end:
                        anyOf:
                          - type: object
                            properties:
                              year:
                                type: integer
                                minimum: 1
                                maximum: 9999
                              month:
                                type: integer
                                minimum: 1
                                maximum: 12
                              day:
                                type: integer
                                minimum: 1
                                maximum: 31
                            required:
                              - year
                            additionalProperties: false
                          - type: "null"
                      approximate:
                        default: false
                        type: boolean
                    required:
                      - kind
                      - start
                      - end
                    additionalProperties: false
                  - type: object
                    properties:
                      kind:
                        type: string
                        const: season
                      season:
                        type: string
                        enum:
                          - spring
                          - summer
                          - autumn
                          - winter
                      year:
                        type: integer
                        minimum: 1
                        maximum: 9998
                      approximate:
                        default: false
                        type: boolean
                    required:
                      - kind
                      - season
                      - year
                    additionalProperties: false
                  - type: object
                    properties:
                      kind:
                        type: string
                        const: custom
                      text:
                        type: string
                        minLength: 1
                        maxLength: 200
                      start:
                        anyOf:
                          - type: object
                            properties:
                              year:
                                type: integer
                                minimum: 1
                                maximum: 9999
                              month:
                                type: integer
                                minimum: 1
                                maximum: 12
                              day:
                                type: integer
                                minimum: 1
                                maximum: 31
                            required:
                              - year
                            additionalProperties: false
                          - type: "null"
                      end:
                        anyOf:
                          - type: object
                            properties:
                              year:
                                type: integer
                                minimum: 1
                                maximum: 9999
                              month:
                                type: integer
                                minimum: 1
                                maximum: 12
                              day:
                                type: integer
                                minimum: 1
                                maximum: 31
                            required:
                              - year
                            additionalProperties: false
                          - type: "null"
                    required:
                      - kind
                      - text
                      - start
                      - end
                    additionalProperties: false
                  - type: object
                    properties:
                      kind:
                        type: string
                        const: unknown
                    required:
                      - kind
                    additionalProperties: false
              start_date:
                type:
                  - string
                  - "null"
              end_date:
                type:
                  - string
                  - "null"
              person_ids:
                type: array
                items:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              category_ids:
                type: array
                items:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              created_at:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
              updated_at:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
            required:
              - id
              - project_id
              - version
              - title
              - description
              - location
              - date
              - start_date
              - end_date
              - person_ids
              - category_ids
        hasMore:
          type: boolean
      required:
        - events
        - hasMore
    Message:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
paths:
  /api/session:
    get:
      operationId: session
