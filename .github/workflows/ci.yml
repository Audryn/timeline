name: Verify Timeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm api:spec:check
      - run: pnpm test
      - run: pnpm test:browser
      - run: pnpm test:built
      # Pixel baselines require the reviewed OS/Edge version; hosted runners drift.
      - run: pnpm test:quality --grep-invert "visual baseline"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-test-results
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
